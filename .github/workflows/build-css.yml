name: Build CSS

# Rebuilds assets/css/site.css whenever pages or styles change, so Tailwind
# classes added while editing HTML on GitHub keep working on the live site.
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'js/**'
      - 'assets/css/tailwind.input.css'
      - 'tailwind.config.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm run build:css
      - name: Commit updated CSS
        run: |
          if git diff --quiet -- assets/css/site.css; then
            echo "site.css is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/site.css
          git commit -m "Rebuild site.css"
          git push
