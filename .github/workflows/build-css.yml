name: Build CSS and PDF

# Rebuilds assets/css/site.css and the resume PDFs whenever pages or styles
# change, so edits made directly on GitHub keep the live site consistent.
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'js/**'
      - 'assets/css/tailwind.input.css'
      - 'assets/img/**'
      - 'tailwind.config.js'
      - 'package.json'
      - 'scripts/build-pdf.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm run build:css
      - run: npx playwright install --with-deps chromium
      - run: npm run build:pdf
      - name: Commit rebuilt files
        run: |
          if git diff --quiet -- assets/css/site.css assets/resume; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/site.css assets/resume
          git commit -m "Rebuild site.css and resume PDFs"
          git push
